---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: 'node-build-action'
description: 'Setup Node.js and build a project with npm, Yarn, pnpm or Bun'

inputs:
  # Optional
  node_version:
    description: 'Node.js version to use for build/install'
    required: false
    default: '22'
  build_tool:
    # yarn is Yarn classic (1.x); yarn-berry is Yarn 2 and later
    description: 'Tool used to perform the build [npm|yarn|yarn-berry|pnpm|bun]'
    required: false
    default: 'npm'
  path_prefix:
    description: 'Path/directory to Node.js project code'
    required: false
    default: '.'
  npm_flags:
    description: 'Flags to pass to npm'
    required: false
  yarn_flags:
    description: 'Flags to pass to yarn (classic or Berry)'
    required: false
  pnpm_flags:
    description: 'Flags to pass to pnpm'
    required: false
  bun_flags:
    description: 'Flags to pass to bun'
    required: false
  bun_version:
    # An exact release, so setup-bun downloads it without querying
    # the GitHub API to resolve a range
    description: 'Bun release to install when build_tool is bun [X.Y.Z]'
    required: false
    default: '1.4.3'
  install_mode:
    # auto: frozen install when a lockfile exists, otherwise resolving
    # frozen: frozen install; fail without an up-to-date lockfile
    # install: resolving install, which may update the lockfile
    description: 'Dependency install mode [auto|frozen|install]'
    required: false
    default: 'auto'
  scripts:
    # Can be provided comma-separated, space-separated or newline-separated
    description: 'Scripts to execute from package.json'
    required: false
    default: 'build'
  exit_on_fail:
    description: 'Exit with error if a script is missing or has a rejected name'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 'Setup action/environment'
      id: setup
      shell: bash
      env:
        BUILD_TOOL: ${{ inputs.build_tool }}
        BUN_VERSION: ${{ inputs.bun_version }}
        PATH_PREFIX_INPUT: ${{ inputs.path_prefix }}
      run: |
        # Setup action/environment
        # Every later step branches on the build tool and does nothing
        # for a value it does not recognise, so reject one here
        case "$BUILD_TOOL" in
          npm|yarn|yarn-berry|pnpm|bun) ;;
          *)
            echo "Error: unsupported build_tool '$BUILD_TOOL';" \
              "expected npm, yarn, yarn-berry, pnpm or bun ❌"
            exit 1
            ;;
        esac
        if [ "$BUILD_TOOL" = bun ] && \
          [[ ! "$BUN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: bun_version '$BUN_VERSION' is not an exact" \
            "X.Y.Z release ❌"
          exit 1
        fi
        # Handle path_prefix input consistently and when absent
        path_prefix="$PATH_PREFIX_INPUT"
        # Reject newline/carriage-return characters before the value is
        # written to $GITHUB_OUTPUT, so a crafted path cannot inject
        # extra output lines (Git permits newlines in filenames).
        case "$path_prefix" in
          *$'\n'* | *$'\r'*)
            echo "Error: path_prefix must not contain newline characters ❌"
            exit 1
            ;;
        esac
        if [ -z "$path_prefix" ]; then
          # Set current directory as path prefix
          path_prefix="."
        else
          # Strip any trailing slash in provided path
          path_prefix="${path_prefix%/}"
        fi
        # Verify is a valid directory path
        if [ ! -d "$path_prefix" ]; then
          echo "Error: invalid path/prefix to project directory ❌"; exit 1
        fi
        echo "path_prefix=$path_prefix" >> "$GITHUB_OUTPUT"

    - name: 'Check for: package.json'
      id: path-check
      # yamllint disable-line rule:line-length
      uses: lfreleng-actions/path-check-action@fae378ddc06f437c39464ca02d6d9c362ca89d3c # v0.2.2
      with:
        path: "${{ steps.setup.outputs.path_prefix }}/package.json"

    - name: 'Validate action/environment'
      shell: bash
      env:
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
        BUILD_TOOL: ${{ inputs.build_tool }}
        PATH_CHECK_TYPE: ${{ steps.path-check.outputs.type }}
      run: |
        # Validate action/environment
        echo "# 🛠️ Node.js Build" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$PATH_PREFIX" ] && \
          [ ! -d "$PATH_PREFIX" ]; then
          echo "Error: invalid path to project directory ❌"
          echo "Error: invalid path to project directory ❌" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Path: $PATH_PREFIX"
          exit 1
        fi
        if [ "$PATH_CHECK_TYPE" != 'file' ]; then
          echo "Error: No Node.js package.json file was found ❌"
          echo "Error: No Node.js package.json file was found ❌" \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "Building with tool: $BUILD_TOOL 💬"
        echo "Building with tool: $BUILD_TOOL" \
          >> "$GITHUB_STEP_SUMMARY"

    - name: 'Setup Node.js'
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node_version }}
        # setup-node otherwise caches npm dependencies whenever the
        # package.json at the workspace root names npm as its package
        # manager; a cache written by a less-trusted run could poison a
        # later privileged build (CWE-349)
        package-manager-cache: false

    # Yarn Berry and pnpm run through Corepack, which fetches the release
    # a project pins in its packageManager field. Node.js 25 and later
    # do not bundle Corepack, so install a pinned release on every
    # Node.js version alike; its yarn and pnpm executables are the
    # shims that 'corepack enable' would otherwise create. The steps
    # that run them put its bin directory first on their own PATH,
    # leaving the caller's later steps untouched.
    - name: 'Setup Corepack'
      id: corepack
      if: inputs.build_tool == 'yarn-berry' || inputs.build_tool == 'pnpm'
      shell: bash
      env:
        BUILD_TOOL: ${{ inputs.build_tool }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
        COREPACK_VERSION: '0.36.0'
      # An exact version: the registry never lets a published version
      # change, so no lockfile is needed to fix what installs
      run: |  # zizmor: ignore[adhoc-packages]
        # Setup Corepack
        package_manager=$(jq -r '.packageManager // ""' \
          "$PATH_PREFIX/package.json")
        case "$BUILD_TOOL" in
          yarn-berry)
            # Unpinned, Corepack would run Yarn classic
            if [[ ! "$package_manager" =~ ^yarn@([2-9]|[1-9][0-9]+)\. ]]; then
              echo "Error: build_tool 'yarn-berry' needs packageManager" \
                "in package.json to pin Yarn 2 or later, such as" \
                "'yarn@4.9.1'; found '${package_manager:-nothing}' ❌"
              exit 1
            fi
            tool=yarn
            ;;
          pnpm)
            # Unpinned, Corepack runs its own default pnpm release
            if [ -n "$package_manager" ] && \
              [[ "$package_manager" != pnpm@* ]]; then
              echo "Error: build_tool 'pnpm' conflicts with" \
                "packageManager '$package_manager' in package.json ❌"
              exit 1
            fi
            tool=pnpm
            ;;
        esac

        corepack_dir="$RUNNER_TEMP/corepack"
        npm install --global --prefix "$corepack_dir" --ignore-scripts \
          --no-audit --no-fund "corepack@$COREPACK_VERSION"
        # npm puts global executables in <prefix>/bin, except on Windows,
        # where they sit in the prefix itself; Bash's PATH needs that as
        # a POSIX path, since a drive letter's colon would split it
        if [ "$RUNNER_OS" = Windows ]; then
          corepack_bin=$(cygpath -u "$corepack_dir")
        else
          corepack_bin="$corepack_dir/bin"
        fi
        echo "bin=$corepack_bin" >> "$GITHUB_OUTPUT"

        # Fetch the release now, so a download failure surfaces here
        version=$(cd "$PATH_PREFIX" && "$corepack_bin/$tool" --version)
        echo "Using $tool $version (Corepack $COREPACK_VERSION) 💬"
        echo "Using $tool $version (Corepack $COREPACK_VERSION)" \
          >> "$GITHUB_STEP_SUMMARY"

    - name: 'Setup Bun'
      if: inputs.build_tool == 'bun'
      # yamllint disable-line rule:line-length
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun_version }}
        # A cache written by a less-trusted run could poison a later
        # privileged build, as with setup-node above
        no-cache: true
        # An exact version needs no GitHub API lookup, so no token
        token: ''

    - name: 'Validate build tool flags'
      shell: bash
      env:
        BUILD_TOOL: ${{ inputs.build_tool }}
        NPM_FLAGS: ${{ inputs.npm_flags }}
        YARN_FLAGS: ${{ inputs.yarn_flags }}
        PNPM_FLAGS: ${{ inputs.pnpm_flags }}
        BUN_FLAGS: ${{ inputs.bun_flags }}
      run: |
        # Shared validation function for build tool flags
        validate_flags() {
          local flags="$1"
          local tool_name="$2"

          # Check for dangerous characters or patterns
          # Blocks: ; & | ` ( ) < > and command substitution patterns $( ${ }
          if echo "$flags" | grep -qE '[;&|`()<>]|\$\(|\$\{|\}'; then
            echo "Error: Invalid characters detected in ${tool_name}_flags ❌"
            echo "Cannot contain: ; & | \` ( ) < >"
            echo "Or command substitution patterns \$( \${ }"
            exit 1
          fi
        }

        # Validate the appropriate flags based on build tool
        case "$BUILD_TOOL" in
          npm) validate_flags "$NPM_FLAGS" "npm" ;;
          yarn|yarn-berry) validate_flags "$YARN_FLAGS" "yarn" ;;
          pnpm) validate_flags "$PNPM_FLAGS" "pnpm" ;;
          bun) validate_flags "$BUN_FLAGS" "bun" ;;
        esac

    - name: 'Resolve install mode'
      id: install-mode
      shell: bash
      env:
        BUILD_TOOL: ${{ inputs.build_tool }}
        INSTALL_MODE: ${{ inputs.install_mode }}
        NPM_FLAGS: ${{ inputs.npm_flags }}
        YARN_FLAGS: ${{ inputs.yarn_flags }}
        PNPM_FLAGS: ${{ inputs.pnpm_flags }}
        BUN_FLAGS: ${{ inputs.bun_flags }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      run: |
        # Resolve install mode
        # A frozen install reproduces the lockfile exactly and fails when
        # it is missing or out of date; a resolving install may update
        # it. Supporting another package manager means adding its
        # lockfiles and any lockfile-disabling flag below, and choosing
        # its frozen command from the 'frozen' output in its install step.
        case "$INSTALL_MODE" in
          auto|frozen|install) ;;
          *)
            echo "Error: unsupported install_mode '$INSTALL_MODE';" \
              "expected auto, frozen or install ❌"
            exit 1
            ;;
        esac

        # Setup has already rejected any build_tool outside this list
        build_tool="$BUILD_TOOL"
        case "$build_tool" in
          npm)
            # npm ci prefers npm-shrinkwrap.json when both exist
            lockfiles="npm-shrinkwrap.json package-lock.json"
            flags_input=npm_flags
            flags="$NPM_FLAGS"
            no_lockfile_flag="--no-package-lock"
            ;;
          yarn)
            lockfiles="yarn.lock"
            flags_input=yarn_flags
            flags="$YARN_FLAGS"
            no_lockfile_flag="--no-lockfile"
            ;;
          yarn-berry)
            # Berry has no flag to ignore its lockfile
            lockfiles="yarn.lock"
            flags_input=yarn_flags
            flags="$YARN_FLAGS"
            no_lockfile_flag=""
            ;;
          pnpm)
            lockfiles="pnpm-lock.yaml"
            flags_input=pnpm_flags
            flags="$PNPM_FLAGS"
            no_lockfile_flag="--no-lockfile"
            ;;
          bun)
            # bun.lockb is the binary format Bun wrote before 1.2
            lockfiles="bun.lock bun.lockb"
            flags_input=bun_flags
            flags="$BUN_FLAGS"
            no_lockfile_flag=""
            ;;
          *)
            echo "Error: no install mode rules for build_tool" \
              "'$build_tool' ❌"
            exit 1
            ;;
        esac

        lockfile=""
        for candidate in $lockfiles; do
          if [ -f "$PATH_PREFIX/$candidate" ]; then
            lockfile="$candidate"
            break
          fi
        done

        # A flag that tells the tool to ignore its lockfile is an
        # explicit opt-out: auto honours it, frozen cannot
        lockfile_disabled=false
        set -f
        for flag in $flags; do
          if [ -n "$no_lockfile_flag" ] && \
            [ "$flag" = "$no_lockfile_flag" ]; then
            lockfile_disabled=true
          fi
        done
        set +f

        frozen=false
        if [ "$INSTALL_MODE" = "frozen" ]; then
          if [ "$lockfile_disabled" = true ]; then
            echo "Error: install_mode 'frozen' conflicts with" \
              "$no_lockfile_flag in $flags_input ❌"
            exit 1
          fi
          if [ -z "$lockfile" ]; then
            echo "Error: install_mode 'frozen' needs a lockfile" \
              "($lockfiles) in $PATH_PREFIX ❌"
            exit 1
          fi
          frozen=true
        elif [ "$INSTALL_MODE" = "auto" ] && [ -n "$lockfile" ]; then
          if [ "$lockfile_disabled" = true ]; then
            echo "$flags_input contains $no_lockfile_flag;" \
              "ignoring $lockfile 💬"
          else
            frozen=true
          fi
        fi

        if [ "$frozen" = true ]; then
          detail="frozen, from $lockfile"
        else
          detail="resolving"
        fi
        echo "Install mode: $INSTALL_MODE ($detail) 💬"
        echo "Install mode: $INSTALL_MODE ($detail)" >> "$GITHUB_STEP_SUMMARY"
        echo "frozen=$frozen" >> "$GITHUB_OUTPUT"

    - name: 'Install dependencies with NPM'
      shell: bash
      if: inputs.build_tool == 'npm'
      env:
        FROZEN: ${{ steps.install-mode.outputs.frozen }}
        NPM_FLAGS: ${{ inputs.npm_flags }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      # Installs the project's own dependencies from its package.json
      # manifest (and lockfile when present); flags are strictly
      # allowlisted below, so no ad-hoc package can be specified
      run: |  # zizmor: ignore[adhoc-packages]
        # Install project dependencies with NPM
        npm_flags="$NPM_FLAGS"

        # Whitelist allowed npm flags (common safe flags only)
        if [ -n "$npm_flags" ]; then
          prev_flag=""
          for flag in $npm_flags; do
            case "$flag" in
              --no-save|--no-package-lock|--ignore-scripts|\
              --no-audit|--no-fund|--legacy-peer-deps|--force|\
              --verbose|--quiet|--loglevel=*|--production|\
              --omit=*|--include=*|--prefer-offline|--prefer-online)
                # Allowed flag
                prev_flag="$flag"
                ;;
              --loglevel|--omit|--include)
                # Flags that expect a value next
                prev_flag="$flag"
                ;;
              silent|error|warn|info|verbose|silly)
                # Log level values - only allowed after --loglevel
                if [ "$prev_flag" = "--loglevel" ]; then
                  prev_flag=""
                else
                  echo "Error: Unexpected value '$flag' ❌"
                  echo "Log levels (silent, error, warn, info, verbose, silly)"
                  echo "  are only allowed after --loglevel"
                  exit 1
                fi
                ;;
              dev|peer|optional)
                # Dependency type values - only allowed after
                # --omit or --include
                if [ "$prev_flag" = "--omit" ] || \
                  [ "$prev_flag" = "--include" ]; then
                  prev_flag=""
                else
                  echo "Error: Unexpected value '$flag' ❌"
                  echo "Dependency types (dev, peer, optional)"
                  echo "  are only allowed after --omit or --include"
                  exit 1
                fi
                ;;
              *)
                echo "Error: Flag '$flag' is not in the allowlist ❌"
                echo "Allowed flags: --no-save, --no-package-lock,"
                echo "  --ignore-scripts, --no-audit, --no-fund,"
                echo "  --legacy-peer-deps, --force, --verbose, --quiet,"
                echo "  --loglevel[=LEVEL], --production, --omit[=TYPE],"
                echo "  --include[=TYPE], --prefer-offline, --prefer-online"
                echo "Note: Flags with values support both --flag=value"
                echo "  and --flag value syntax"
                exit 1
                ;;
            esac
          done
        fi

        # Disable filename globbing so an allowlisted flag value
        # containing a glob character (e.g. '*') is not expanded against
        # the workspace; whitespace word-splitting of the flags is
        # still applied intentionally.
        set -f
        if [ "$FROZEN" = true ]; then
          npm ci --prefix "$PATH_PREFIX" $npm_flags
        else
          npm install --prefix "$PATH_PREFIX" $npm_flags
        fi

    - name: 'Install dependencies with Yarn'
      shell: bash
      if: inputs.build_tool == 'yarn'
      env:
        FROZEN: ${{ steps.install-mode.outputs.frozen }}
        YARN_FLAGS: ${{ inputs.yarn_flags }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      run: |
        # Install project dependencies with Yarn
        yarn_flags="$YARN_FLAGS"

        # Whitelist allowed yarn flags (common safe flags only)
        if [ -n "$yarn_flags" ]; then
          prev_flag=""
          for flag in $yarn_flags; do
            case "$flag" in
              --production|--frozen-lockfile|--pure-lockfile|\
              --no-lockfile|--ignore-scripts|--ignore-optional|\
              --force|--verbose|--silent|--no-progress|\
              --network-timeout=*|--prefer-offline|--offline)
                # Allowed flag
                prev_flag="$flag"
                ;;
              --network-timeout)
                # Flag that expects a numeric value next
                prev_flag="$flag"
                ;;
              [0-9]*)
                # Numeric values are only allowed after --network-timeout
                if [ "$prev_flag" = "--network-timeout" ]; then
                  prev_flag=""
                else
                  echo "Error: Unexpected numeric value '$flag' ❌"
                  echo "Numeric values are only allowed after --network-timeout"
                  exit 1
                fi
                ;;
              *)
                echo "Error: Flag '$flag' is not in the allowlist ❌"
                echo "Allowed flags: --production, --frozen-lockfile,"
                echo "  --pure-lockfile, --no-lockfile, --ignore-scripts,"
                echo "  --ignore-optional, --force, --verbose, --silent,"
                echo "  --no-progress, --network-timeout[=MS],"
                echo "  --prefer-offline, --offline"
                echo "Note: Flags with values support both --flag=value"
                echo "  and --flag value syntax"
                exit 1
                ;;
            esac
          done
        fi

        # Disable filename globbing so an allowlisted flag value
        # containing a glob character (e.g. '*') is not expanded against
        # the workspace; whitespace word-splitting of the flags is
        # still applied intentionally.
        set -f
        cd "$PATH_PREFIX"
        if [ "$FROZEN" = true ]; then
          yarn install --frozen-lockfile $yarn_flags
        else
          yarn install $yarn_flags
        fi

    - name: 'Install dependencies with Yarn Berry'
      shell: bash
      if: inputs.build_tool == 'yarn-berry'
      env:
        FROZEN: ${{ steps.install-mode.outputs.frozen }}
        YARN_FLAGS: ${{ inputs.yarn_flags }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
        COREPACK_BIN: ${{ steps.corepack.outputs.bin }}
      run: |
        # Install project dependencies with Yarn Berry
        export PATH="$COREPACK_BIN:$PATH"
        yarn_flags="$YARN_FLAGS"

        # Whitelist allowed Yarn Berry flags; Berry dropped most of Yarn
        # classic's flags, and install_mode chooses --immutable
        set -f
        for flag in $yarn_flags; do
          case "$flag" in
            --immutable-cache|--check-cache|--check-resolutions|\
            --inline-builds|--json|--mode=skip-build)
              # Allowed flag
              ;;
            *)
              echo "Error: Flag '$flag' is not in the Yarn Berry" \
                "allowlist ❌"
              echo "Allowed flags: --immutable-cache, --check-cache,"
              echo "  --check-resolutions, --inline-builds, --json,"
              echo "  --mode=skip-build"
              exit 1
              ;;
          esac
        done

        cd "$PATH_PREFIX"
        # Berry installs immutably under CI unless told otherwise
        if [ "$FROZEN" = true ]; then
          yarn install --immutable $yarn_flags
        else
          yarn install --no-immutable $yarn_flags
        fi

    - name: 'Install dependencies with pnpm'
      shell: bash
      if: inputs.build_tool == 'pnpm'
      env:
        FROZEN: ${{ steps.install-mode.outputs.frozen }}
        PNPM_FLAGS: ${{ inputs.pnpm_flags }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
        COREPACK_BIN: ${{ steps.corepack.outputs.bin }}
      run: |
        # Install project dependencies with pnpm
        export PATH="$COREPACK_BIN:$PATH"
        pnpm_flags="$PNPM_FLAGS"

        # Whitelist allowed pnpm flags; install_mode chooses
        # --frozen-lockfile
        set -f
        for flag in $pnpm_flags; do
          case "$flag" in
            --prod|--dev|--no-optional|--no-lockfile|--ignore-scripts|\
            --prefer-offline|--offline|--strict-peer-dependencies|\
            --silent|--reporter=default|--reporter=ndjson|\
            --reporter=silent|--loglevel=debug|--loglevel=info|\
            --loglevel=warn|--loglevel=error)
              # Allowed flag
              ;;
            *)
              echo "Error: Flag '$flag' is not in the pnpm allowlist ❌"
              echo "Allowed flags: --prod, --dev, --no-optional,"
              echo "  --no-lockfile, --ignore-scripts, --prefer-offline,"
              echo "  --offline, --strict-peer-dependencies, --silent,"
              echo "  --reporter=REPORTER, --loglevel=LEVEL"
              exit 1
              ;;
          esac
        done

        cd "$PATH_PREFIX"
        # pnpm installs from a frozen lockfile under CI unless told
        # otherwise
        if [ "$FROZEN" = true ]; then
          pnpm install --frozen-lockfile $pnpm_flags
        else
          pnpm install --no-frozen-lockfile $pnpm_flags
        fi

    - name: 'Install dependencies with Bun'
      shell: bash
      if: inputs.build_tool == 'bun'
      env:
        FROZEN: ${{ steps.install-mode.outputs.frozen }}
        BUN_FLAGS: ${{ inputs.bun_flags }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      run: |
        # Install project dependencies with Bun
        bun_flags="$BUN_FLAGS"

        # Whitelist allowed Bun flags; install_mode chooses
        # --frozen-lockfile
        set -f
        for flag in $bun_flags; do
          case "$flag" in
            --production|--ignore-scripts|--omit=dev|--omit=optional|\
            --omit=peer|--linker=isolated|--linker=hoisted|--verbose|\
            --silent|--no-progress)
              # Allowed flag
              ;;
            *)
              echo "Error: Flag '$flag' is not in the Bun allowlist ❌"
              echo "Allowed flags: --production, --ignore-scripts,"
              echo "  --omit=TYPE, --linker=LINKER, --verbose, --silent,"
              echo "  --no-progress"
              exit 1
              ;;
          esac
        done

        cd "$PATH_PREFIX"
        if [ "$FROZEN" = true ]; then
          bun install --frozen-lockfile $bun_flags
        else
          bun install $bun_flags
        fi

    - name: 'Parse and validate scripts'
      id: parse-scripts
      shell: bash
      env:
        SCRIPTS_INPUT: ${{ inputs.scripts }}
        EXIT_ON_FAIL: ${{ inputs.exit_on_fail }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
      run: |
        # Parse and validate scripts from package.json
        scripts_input="$SCRIPTS_INPUT"
        exit_on_fail="$EXIT_ON_FAIL"

        if [ -z "$scripts_input" ]; then
          echo "No scripts to execute"
          exit 0
        fi

        # Read package.json and extract scripts section
        package_json="$PATH_PREFIX/package.json"

        # Normalize input: convert commas, spaces, and newlines to spaces
        # This allows flexible input formats
        scripts_normalized=$(echo "$scripts_input" | tr ',\n' ' ')

        # Split into array by spaces
        IFS=' ' read -ra SCRIPT_ARRAY <<< "$scripts_normalized"

        valid_scripts=""
        invalid_scripts=""
        has_error=false

        for script in "${SCRIPT_ARRAY[@]}"; do
          # Trim surrounding whitespace with parameter expansion; xargs
          # would choke on quotes or backslashes before the name check
          script="${script#"${script%%[![:space:]]*}"}"
          script="${script%"${script##*[![:space:]]}"}"
          [ -z "$script" ] && continue

          # Validate script name: allow the characters common in npm
          # script names (e.g. test:unit, build.prod, @scope/lint) and
          # reject anything else, such as shell metacharacters
          if [[ ! "$script" =~ ^[a-zA-Z0-9_.:/@-]+$ ]]; then
            if [ "$exit_on_fail" = "true" ]; then
              message="Error: Script name '$script' contains"
              message="$message unsupported characters ❌"
              has_error=true
            else
              message="Warning: Script name '$script' contains"
              message="$message unsupported characters; skipping ⚠️"
            fi
            echo "$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            continue
          fi

          # Check if script exists in package.json
          if jq -e --arg script "$script" '.scripts[$script]' \
            "$package_json" > /dev/null 2>&1; then
            echo "✓ Script \`$script\` found in package.json"
            if [ -z "$valid_scripts" ]; then
              valid_scripts="$script"
            else
              valid_scripts="$valid_scripts,$script"
            fi
          else
            if [ "$exit_on_fail" = "true" ]; then
              echo "Error: Script \`$script\` not found in package.json ❌"
              has_error=true
            else
              echo "Warning: Script \`$script\` not found in package.json ⚠️"
            fi
            if [ -z "$invalid_scripts" ]; then
              invalid_scripts="$script"
            else
              invalid_scripts="$invalid_scripts,$script"
            fi
          fi
        done

        # Build output for GITHUB_STEP_SUMMARY
        if [ -n "$valid_scripts" ]; then
          echo "### Scripts to execute:" >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra VALID_ARRAY <<< "$valid_scripts"
          for script in "${VALID_ARRAY[@]}"; do
            echo "- \`$script\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ -n "$invalid_scripts" ]; then
          if [ "$exit_on_fail" = "true" ]; then
            echo "❌ Error: scripts were referenced that were not" \
              "found in package.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Warning: scripts were referenced that were not" \
              "found in package.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          IFS=',' read -ra INVALID_ARRAY <<< "$invalid_scripts"
          for script in "${INVALID_ARRAY[@]}"; do
            echo "- \`$script\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
        fi

        # Exit with error if any script was not found and exit_on_fail is true
        if [ "$has_error" = true ]; then
          exit 1
        fi

        echo "valid_scripts=$valid_scripts" >> "$GITHUB_OUTPUT"

    - name: 'Execute scripts'
      shell: bash
      if: steps.parse-scripts.outputs.valid_scripts != ''
      env:
        BUILD_TOOL: ${{ inputs.build_tool }}
        PATH_PREFIX: ${{ steps.setup.outputs.path_prefix }}
        VALID_SCRIPTS: ${{ steps.parse-scripts.outputs.valid_scripts }}
        COREPACK_BIN: ${{ steps.corepack.outputs.bin }}
      run: |
        # Execute scripts with selected build tool
        build_tool="$BUILD_TOOL"
        path_prefix="$PATH_PREFIX"
        if [ -n "$COREPACK_BIN" ]; then
          export PATH="$COREPACK_BIN:$PATH"
        fi
        IFS=',' read -ra SCRIPT_ARRAY <<< "$VALID_SCRIPTS"

        for script in "${SCRIPT_ARRAY[@]}"; do
          script=$(echo "$script" | xargs)
          [ -z "$script" ] && continue

          if [ "$build_tool" = "npm" ]; then
            echo "Executing npm run $script..."
            npm run "$script" --prefix "$path_prefix"
          else
            # yarn and yarn-berry both run as yarn; for Berry, the
            # Corepack shim runs the project's pinned release
            tool="${build_tool%-berry}"
            echo "Executing $tool run $script..."
            # Subshell, so a relative path_prefix resolves from the same
            # directory for every script
            (cd "$path_prefix" && "$tool" run "$script")
          fi
        done
