---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ### Test that setup-node caches nothing implicitly ###
  implicit-cache:
    name: 'Test: no implicit npm cache'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # setup-node turns on npm caching by itself when the package.json at
      # the workspace root names npm in packageManager, and then aborts
      # because no lockfile sits beside it. The action passing here shows
      # that setup-node never attempted a cache restore.
      - name: 'Create fixture: packageManager npm, no lockfile'
        shell: bash
        run: |
          # Create fixture: packageManager npm, no lockfile
          cat > package.json << 'EOF'
          {
            "name": "implicit-cache-fixture",
            "version": "1.0.0",
            "private": true,
            "packageManager": "npm@10.9.2",
            "scripts": {
              "build": "echo 'Hello build!'"
            }
          }
          EOF

      - name: "Run action: ${{ github.repository }} [NPM/packageManager]"
        uses: $/
        with:
          build_tool: 'npm'

  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Test local GitHub Action'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      # Perform setup prior to running test(s)
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'lfreleng-actions/test-node-project'
          path: 'test-node-project'
          persist-credentials: false

      # Perform test build/install with npm
      - name: "Run action: ${{ github.repository }} [NPM]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'

      # Perform test build/install with npm
      - name: "Run action: ${{ github.repository }} [NPM/No Flags]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          npm_flags: ''

      # Test with custom scripts parameter (single script)
      - name: "Run action: ${{ github.repository }} [NPM/Custom Script]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          scripts: 'build'

      # Test with multiple scripts (comma-separated)
      - name: "Run action: ${{ github.repository }} [NPM/Scripts/Comma]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          scripts: 'test,build'

      # Test with multiple scripts (space-separated)
      - name: "Run action: ${{ github.repository }} [NPM/Scripts/Space]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          scripts: 'test build'

      # Test with multiple scripts (newline-separated)
      - name: "Run action: ${{ github.repository }} [NPM/Scripts/Newline]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          scripts: |
            test
            build

      # Perform test build/install with yarn
      - name: "Run action: ${{ github.repository }} [YARN]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'yarn'

      # Perform test build/install with yarn
      - name: "Run action: ${{ github.repository }} [YARN/No Flags]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'yarn'
          yarn_flags: ''

      # Test with yarn and custom scripts
      - name: "Run action: ${{ github.repository }} [YARN/Custom Script]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'yarn'
          scripts: 'build'

      # install_mode: each drift fixture declares a dependency that its
      # lockfile lacks, so only a resolving install can succeed
      - name: 'Create install_mode fixtures'
        shell: bash
        run: |
          # Create install_mode fixtures
          for dir in npm-drift-auto npm-drift-frozen npm-drift-install \
            npm-drift-optout npm-none-auto npm-none-frozen \
            yarn-drift-auto yarn-drift-install yarn-drift-optout \
            yarn-none-auto yarn-none-frozen; do
            mkdir -p "install-mode/$dir"
            cat > "install-mode/$dir/package.json" << 'EOF'
          {
            "name": "install-mode-fixture",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "is-number": "7.0.0"
            },
            "scripts": {
              "build": "echo 'Hello build!'"
            }
          }
          EOF
          done
          for dir in npm-drift-auto npm-drift-frozen npm-drift-install \
            npm-drift-optout; do
            cat > "install-mode/$dir/package-lock.json" << 'EOF'
          {
            "name": "install-mode-fixture",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "install-mode-fixture",
                "version": "1.0.0"
              }
            }
          }
          EOF
          done
          for dir in yarn-drift-auto yarn-drift-install yarn-drift-optout; do
            printf '# yarn lockfile v1\n\n\n' > "install-mode/$dir/yarn.lock"
          done

      - name: "Run action: ${{ github.repository }} [NPM/Install mode: frozen]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          install_mode: 'frozen'

      - name: "Run action: ${{ github.repository }} [NPM/Auto/Drift]"
        id: npm-drift-auto
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/npm-drift-auto'
          build_tool: 'npm'

      - name: "Run action: ${{ github.repository }} [NPM/Frozen/Drift]"
        id: npm-drift-frozen
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/npm-drift-frozen'
          build_tool: 'npm'
          install_mode: 'frozen'

      - name: "Run action: ${{ github.repository }} [NPM/Frozen/No lockfile]"
        id: npm-none-frozen
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/npm-none-frozen'
          build_tool: 'npm'
          install_mode: 'frozen'

      - name: "Run action: ${{ github.repository }} [NPM/Frozen/No-lock flag]"
        id: npm-frozen-no-lock-flag
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          install_mode: 'frozen'
          npm_flags: '--no-package-lock'

      - name: "Run action: ${{ github.repository }} [NPM/Install/Drift]"
        uses: $/
        with:
          path_prefix: 'install-mode/npm-drift-install'
          build_tool: 'npm'
          install_mode: 'install'

      - name: "Run action: ${{ github.repository }} [NPM/Auto/No lockfile]"
        uses: $/
        with:
          path_prefix: 'install-mode/npm-none-auto'
          build_tool: 'npm'

      # The opt-out flag makes auto resolve, despite the drifted lockfile
      - name: "Run action: ${{ github.repository }} [NPM/Auto/Opt-out]"
        uses: $/
        with:
          path_prefix: 'install-mode/npm-drift-optout'
          build_tool: 'npm'
          npm_flags: '--no-package-lock'

      - name: "Run action: ${{ github.repository }} [Unsupported install_mode]"
        id: bad-install-mode
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          install_mode: 'bogus'

      - name: "Run action: ${{ github.repository }} [YARN/Auto/Drift]"
        id: yarn-drift-auto
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/yarn-drift-auto'
          build_tool: 'yarn'

      - name: "Run action: ${{ github.repository }} [YARN/Frozen/No lockfile]"
        id: yarn-none-frozen
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/yarn-none-frozen'
          build_tool: 'yarn'
          install_mode: 'frozen'

      - name: "Run action: ${{ github.repository }} [YARN/Install/Drift]"
        uses: $/
        with:
          path_prefix: 'install-mode/yarn-drift-install'
          build_tool: 'yarn'
          install_mode: 'install'

      - name: "Run action: ${{ github.repository }} [YARN/Auto/No lockfile]"
        uses: $/
        with:
          path_prefix: 'install-mode/yarn-none-auto'
          build_tool: 'yarn'

      # The opt-out flag makes auto resolve, despite the drifted lockfile
      - name: "Run action: ${{ github.repository }} [YARN/Auto/Opt-out]"
        uses: $/
        with:
          path_prefix: 'install-mode/yarn-drift-optout'
          build_tool: 'yarn'
          yarn_flags: '--no-lockfile'

      - name: 'Verify: install_mode results'
        shell: bash
        env:
          NPM_DRIFT_AUTO: ${{ steps.npm-drift-auto.outcome }}
          NPM_DRIFT_FROZEN: ${{ steps.npm-drift-frozen.outcome }}
          NPM_NONE_FROZEN: ${{ steps.npm-none-frozen.outcome }}
          NPM_FROZEN_NO_LOCK_FLAG: ${{ steps.npm-frozen-no-lock-flag.outcome }}
          BAD_INSTALL_MODE: ${{ steps.bad-install-mode.outcome }}
          YARN_DRIFT_AUTO: ${{ steps.yarn-drift-auto.outcome }}
          YARN_NONE_FROZEN: ${{ steps.yarn-none-frozen.outcome }}
        run: |
          # Verify: install_mode results
          status=0
          for check in NPM_DRIFT_AUTO NPM_DRIFT_FROZEN NPM_NONE_FROZEN \
            NPM_FROZEN_NO_LOCK_FLAG BAD_INSTALL_MODE \
            YARN_DRIFT_AUTO YARN_NONE_FROZEN; do
            outcome="${!check}"
            if [ "$outcome" != 'failure' ]; then
              echo "Error: $check: expected failure, got $outcome ❌"
              status=1
            fi
          done
          # A resolving install records is-number in the lockfile, as the
          # action always did before install_mode existed
          for lockfile in npm-drift-install/package-lock.json \
            npm-none-auto/package-lock.json yarn-drift-install/yarn.lock \
            yarn-none-auto/yarn.lock; do
            if ! grep -q 'is-number' "install-mode/$lockfile"; then
              echo "Error: $lockfile lacks is-number; not resolved ❌"
              status=1
            fi
          done
          exit "$status"

      # Test with EXIT_ON_FAIL set to false (should warn but not fail)
      - name: "Run action: ${{ github.repository }} [NPM/Exit on Fail: false]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          scripts: 'build,nonexistent-script'
          exit_on_fail: 'false'

      # Test with EXIT_ON_FAIL set to true and valid scripts only
      - name: "Run action: ${{ github.repository }} [NPM/Exit on Fail: true]"
        uses: $/
        with:
          path_prefix: 'test-node-project/'
          build_tool: 'npm'
          scripts: 'build'
          exit_on_fail: 'true'

  ### Test that requested scripts run, or the action fails ###
  script-tests:
    name: 'Test script handling'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      # Each script leaves a marker file, so the checks below can tell a
      # script that ran from one the action skipped
      - name: 'Create fixtures'
        shell: bash
        run: |
          # Create fixtures
          for dir in npm-scripts sub/dir; do
            mkdir -p "$dir"
            cat > "$dir/package.json" << 'EOF'
          {
            "name": "script-fixture",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "lint:ci": "touch lint-ci.ran",
              "build.prod": "touch build-prod.ran",
              "@scope/check": "touch scope-check.ran"
            }
          }
          EOF
          done

      - name: "Run action: ${{ github.repository }} [NPM/Script names]"
        uses: $/
        with:
          path_prefix: 'npm-scripts'
          build_tool: 'npm'
          scripts: 'lint:ci build.prod @scope/check'

      - name: 'Verify: npm ran every script'
        shell: bash
        run: |
          # Verify: npm ran every script
          for marker in lint-ci build-prod scope-check; do
            if [ ! -f "npm-scripts/$marker.ran" ]; then
              echo "Error: script for $marker did not run ❌"
              exit 1
            fi
          done

      # With exit_on_fail false, a rejected name only warns, even one
      # carrying a quote
      - name: "Run action: ${{ github.repository }} [NPM/Rejected name/Warn]"
        uses: $/
        with:
          path_prefix: 'npm-scripts'
          build_tool: 'npm'
          scripts: "lint:ci bad'name"
          exit_on_fail: 'false'

      - name: "Run action: ${{ github.repository }} [NPM/Missing script]"
        id: missing-script
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'npm-scripts'
          build_tool: 'npm'
          scripts: 'format:check'
          exit_on_fail: 'true'

      - name: "Run action: ${{ github.repository }} [NPM/Unsupported name]"
        id: unsupported-name
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'npm-scripts'
          build_tool: 'npm'
          scripts: 'lint:ci;id'
          exit_on_fail: 'true'

      - name: "Run action: ${{ github.repository }} [Unknown build tool]"
        id: unknown-build-tool
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'npm-scripts'
          build_tool: 'deno'
          scripts: 'lint:ci'

      - name: 'Verify: each invalid request failed the action'
        shell: bash
        env:
          MISSING_SCRIPT: ${{ steps.missing-script.outcome }}
          UNSUPPORTED_NAME: ${{ steps.unsupported-name.outcome }}
          UNKNOWN_BUILD_TOOL: ${{ steps.unknown-build-tool.outcome }}
        run: |
          # Verify: each invalid request failed the action
          status=0
          for check in MISSING_SCRIPT UNSUPPORTED_NAME UNKNOWN_BUILD_TOOL; do
            outcome="${!check}"
            if [ "$outcome" != 'failure' ]; then
              echo "Error: $check: expected failure, got $outcome ❌"
              status=1
            fi
          done
          exit "$status"

      # A relative path_prefix must resolve the same way for every script
      - name: "Run action: ${{ github.repository }} [YARN/Scripts/Subdir]"
        uses: $/
        with:
          path_prefix: 'sub/dir'
          build_tool: 'yarn'
          scripts: 'lint:ci,build.prod'

      - name: 'Verify: yarn ran both scripts'
        shell: bash
        run: |
          # Verify: yarn ran both scripts
          for marker in lint-ci build-prod; do
            if [ ! -f "sub/dir/$marker.ran" ]; then
              echo "Error: script for $marker did not run ❌"
              exit 1
            fi
          done

  ### Test Corepack's shim directory on Windows ###
  package-managers-windows:
    name: 'Test pnpm and Yarn Berry (Windows)'
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # npm places global executables differently on Windows, so the
      # Corepack shims need their own coverage there
      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'lfreleng-actions/test-node-project'
          path: 'test-node-project'
          persist-credentials: false

      - name: "Run action: ${{ github.repository }} [Yarn Berry/Windows]"
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/yarn-berry'
          build_tool: 'yarn-berry'
          scripts: 'build test'

      - name: "Run action: ${{ github.repository }} [pnpm/Windows]"
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/pnpm'
          build_tool: 'pnpm'
          scripts: 'build test'

  ### Test pnpm, Yarn Berry and Bun under blocked egress ###
  package-managers:
    name: 'Test pnpm, Yarn Berry and Bun'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Corepack and Bun download their releases at run time, so prove
      # the organisation allow-list admits every host they reach
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@084d6861688632b2edb6bde3c180145bebf9cc7a'  # v0.17.2

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout sample project repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'lfreleng-actions/test-node-project'
          path: 'test-node-project'
          persist-credentials: false

      - name: "Run action: ${{ github.repository }} [Yarn Berry]"
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/yarn-berry'
          build_tool: 'yarn-berry'
          scripts: 'build test'

      - name: "Run action: ${{ github.repository }} [pnpm]"
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/pnpm'
          build_tool: 'pnpm'
          scripts: 'build test'

      # No packageManager pin, so Corepack's default pnpm runs
      - name: "Run action: ${{ github.repository }} [pnpm/Workspace]"
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/pnpm-workspace'
          build_tool: 'pnpm'
          scripts: 'build test'

      - name: "Run action: ${{ github.repository }} [Bun]"
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/bun'
          build_tool: 'bun'
          scripts: 'build test'

      - name: 'Verify: each variant built with its own tool'
        shell: bash
        run: |
          # Verify: each variant built with its own tool
          variants='test-node-project/variants'
          status=0
          # Yarn Berry and pnpm each leave a state file in node_modules;
          # npm leaves .package-lock.json, so its absence rules npm out
          for check in \
            "yarn-berry/node_modules/.yarn-state.yml" \
            "pnpm/node_modules/.modules.yaml" \
            "pnpm-workspace/node_modules/.modules.yaml" \
            "bun/node_modules/picocolors/package.json" \
            "yarn-berry/dist/index.js" "pnpm/dist/index.js" \
            "pnpm-workspace/packages/app/dist/index.js" \
            "bun/dist/index.js"; do
            if [ ! -f "$variants/$check" ]; then
              echo "Error: $check is missing ❌"
              status=1
            fi
          done
          if [ -e "$variants/bun/node_modules/.package-lock.json" ]; then
            echo "Error: npm, not Bun, installed the bun variant ❌"
            status=1
          fi
          # Frozen installs leave every committed lockfile untouched
          if [ -n "$(git -C test-node-project status --porcelain)" ]; then
            git -C test-node-project status --porcelain
            echo "Error: an install modified the checkout ❌"
            status=1
          fi
          exit "$status"

      # install_mode: each drift fixture declares a dependency that its
      # lockfile lacks, so only a resolving install can succeed
      - name: 'Create install_mode fixtures'
        shell: bash
        run: |
          # Create install_mode fixtures
          for tool in yarn-berry pnpm bun; do
            for mode in auto install; do
              dir="install-mode/$tool-drift-$mode"
              mkdir -p "$dir"
              case "$tool" in
                yarn-berry) pin='"packageManager": "yarn@4.18.1",' ;;
                pnpm) pin='"packageManager": "pnpm@10.34.6",' ;;
                bun) pin='' ;;
              esac
              cat > "$dir/package.json" << EOF
          {
            "name": "install-mode-fixture",
            "version": "1.0.0",
            "private": true,
            $pin
            "dependencies": {
              "is-number": "7.0.0"
            }
          }
          EOF
              case "$tool" in
                yarn-berry)
                  printf 'nodeLinker: node-modules\n' > "$dir/.yarnrc.yml"
                  cat > "$dir/yarn.lock" << 'EOF'
          __metadata:
            version: 8
            cacheKey: 10c0

          "install-mode-fixture@workspace:.":
            version: 0.0.0-use.local
            resolution: "install-mode-fixture@workspace:."
            languageName: unknown
            linkType: soft
          EOF
                  ;;
                pnpm)
                  printf "lockfileVersion: '9.0'\n\nimporters:\n\n  .: {}\n" \
                    > "$dir/pnpm-lock.yaml"
                  ;;
                bun)
                  cat > "$dir/bun.lock" << 'EOF'
          {
            "lockfileVersion": 1,
            "workspaces": {
              "": {
                "name": "install-mode-fixture",
              },
            },
            "packages": {},
          }
          EOF
                  ;;
              esac
            done
          done
          # Yarn classic's project, with no packageManager pin
          cp -r test-node-project/variants/yarn-classic install-mode/no-pin

      - name: "Run action: ${{ github.repository }} [Yarn Berry/Auto/Drift]"
        id: yarn-berry-drift-auto
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/yarn-berry-drift-auto'
          build_tool: 'yarn-berry'
          scripts: ''

      - name: "Run action: ${{ github.repository }} [Yarn Berry/Install/Drift]"
        uses: $/
        with:
          path_prefix: 'install-mode/yarn-berry-drift-install'
          build_tool: 'yarn-berry'
          install_mode: 'install'
          scripts: ''

      - name: "Run action: ${{ github.repository }} [pnpm/Auto/Drift]"
        id: pnpm-drift-auto
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/pnpm-drift-auto'
          build_tool: 'pnpm'
          scripts: ''

      - name: "Run action: ${{ github.repository }} [pnpm/Install/Drift]"
        uses: $/
        with:
          path_prefix: 'install-mode/pnpm-drift-install'
          build_tool: 'pnpm'
          install_mode: 'install'
          scripts: ''

      - name: "Run action: ${{ github.repository }} [Bun/Auto/Drift]"
        id: bun-drift-auto
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/bun-drift-auto'
          build_tool: 'bun'
          scripts: ''

      - name: "Run action: ${{ github.repository }} [Bun/Install/Drift]"
        uses: $/
        with:
          path_prefix: 'install-mode/bun-drift-install'
          build_tool: 'bun'
          install_mode: 'install'
          scripts: ''

      - name: "Run action: ${{ github.repository }} [Yarn Berry/No pin]"
        id: yarn-berry-no-pin
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'install-mode/no-pin'
          build_tool: 'yarn-berry'

      - name: "Run action: ${{ github.repository }} [pnpm/Other pin]"
        id: pnpm-other-pin
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/yarn-berry'
          build_tool: 'pnpm'

      - name: "Run action: ${{ github.repository }} [Yarn Berry/Classic flag]"
        id: yarn-berry-classic-flag
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/yarn-berry'
          build_tool: 'yarn-berry'
          yarn_flags: '--frozen-lockfile'

      - name: "Run action: ${{ github.repository }} [Bun/Version range]"
        id: bun-version-range
        continue-on-error: true
        uses: $/
        with:
          path_prefix: 'test-node-project/variants/bun'
          build_tool: 'bun'
          bun_version: 'latest'

      - name: 'Verify: install_mode and pin results'
        shell: bash
        env:
          YARN_BERRY_DRIFT_AUTO: ${{ steps.yarn-berry-drift-auto.outcome }}
          PNPM_DRIFT_AUTO: ${{ steps.pnpm-drift-auto.outcome }}
          BUN_DRIFT_AUTO: ${{ steps.bun-drift-auto.outcome }}
          YARN_BERRY_NO_PIN: ${{ steps.yarn-berry-no-pin.outcome }}
          PNPM_OTHER_PIN: ${{ steps.pnpm-other-pin.outcome }}
          YARN_BERRY_CLASSIC_FLAG: ${{ steps.yarn-berry-classic-flag.outcome }}
          BUN_VERSION_RANGE: ${{ steps.bun-version-range.outcome }}
        run: |
          # Verify: install_mode and pin results
          status=0
          for check in YARN_BERRY_DRIFT_AUTO PNPM_DRIFT_AUTO BUN_DRIFT_AUTO \
            YARN_BERRY_NO_PIN PNPM_OTHER_PIN YARN_BERRY_CLASSIC_FLAG \
            BUN_VERSION_RANGE; do
            outcome="${!check}"
            if [ "$outcome" != 'failure' ]; then
              echo "Error: $check: expected failure, got $outcome ❌"
              status=1
            fi
          done
          for lockfile in yarn-berry-drift-install/yarn.lock \
            pnpm-drift-install/pnpm-lock.yaml bun-drift-install/bun.lock; do
            if ! grep -q 'is-number' "install-mode/$lockfile"; then
              echo "Error: $lockfile lacks is-number; not resolved ❌"
              status=1
            fi
          done
          exit "$status"
